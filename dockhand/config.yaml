name: Dockhand
version: "1.0.41.1"
slug: dockhand
description: "Modern Docker management UI: a lightweight Portainer alternative."
url: "https://github.com/JigSawFr/dockhand-ha-addon"
image: "ghcr.io/jigsawfr/dockhand-ha-addon"
arch:
  - aarch64
  - amd64
ingress: true
panel_icon: mdi:docker
panel_title: Dockhand
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Optional direct Dockhand access. Disabled by default; use only on trusted networks or behind an authenticated reverse proxy."
devices:
  - /var/run/docker.sock
hassio_role: admin
docker_api: true
apparmor: false
map:
  - type: data
    read_only: false
options:
  log_level: info
  auto_backup_on_start: true
  backup_retention: 5
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  auto_backup_on_start: bool
  backup_retention: int(1,20)
init: false
stage: experimental
