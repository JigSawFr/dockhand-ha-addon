server {
    listen 8099;
    client_max_body_size 0;

    # Only accept connections from the HA Ingress gateway
    allow  172.30.32.2;
    deny   all;

    # Home Assistant ingress shim injected into HTML responses.
    location = /__ha_ingress_shim.js {
        alias /usr/share/dockhand-ha/ingress-shim.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Keep API heartbeat and stream endpoints unbuffered to reduce ingress disconnect noise.
    # Covers: /api/events and any /api/*/stream endpoint.
    location ~ ^/api/(events$|.+/stream$) {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade         "";
        proxy_set_header   Connection      "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ingress-Path    $http_x_ingress_path;

        proxy_cache             off;
        proxy_buffering         off;
        proxy_request_buffering off;
        add_header              X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Dockhand auth redirects to /login; rewrite to relative login so browser
        # keeps the active HA ingress token path.
        proxy_redirect     ~^https?://[^/]+/login(\?.*)?$ login$1;
        proxy_redirect     ~^/login(\?.*)?$             login$1;

        # WebSocket support (required for Dockhand terminal & live log streaming)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection  $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ingress-Path    $http_x_ingress_path;

        # Disable upstream compression so sub_filter can rewrite HTML
        proxy_set_header   Accept-Encoding   "";

        # Inject base path and external shim into every HTML response.
        sub_filter '<head>' "<head><base href=\"$http_x_ingress_path/\"><script src=\"__ha_ingress_shim.js\"></script>";
        sub_filter_types   application/xhtml+xml;
        sub_filter_once    on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
