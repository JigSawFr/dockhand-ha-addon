server {
    # Internal direct-access endpoint for sibling HA add-ons such as
    # Nginx Proxy Manager. This is intentionally separate from HA Ingress.
    listen 3001;
    absolute_redirect off;
    client_max_body_size 0;

    # Local healthchecks are authorized by the geo/map pair. Every network
    # client must present the exact configured proxy token.
    if ($direct_proxy_authorized = 0) {
        return 403;
    }

    location = /__direct_health {
        access_log off;
        return 204;
    }

    # Keep all known SSE and stream endpoints unbuffered.
    location ~ ^/api/(events$|activity/events$|audit/events$|.+/stream$) {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade         "";
        proxy_set_header   Connection      "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $forwarded_host;
        proxy_set_header   X-Forwarded-Proto      $forwarded_proto;
        proxy_set_header   X-Dockhand-Proxy-Token "";

        proxy_cache             off;
        proxy_buffering         off;
        proxy_request_buffering off;
        add_header              X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Keep authentication redirects on the public reverse-proxy origin.
        proxy_redirect     ~^https?://[^/]+/login(\?.*)?$ /login$1;
        proxy_redirect     ~^/login(\?.*)?$             /login$1;

        # Preserve WebSocket support for terminals and live log streaming.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Keep the public reverse-proxy host/scheme when supplied, while also
        # supporting an optional direct host-port mapping.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $forwarded_host;
        proxy_set_header   X-Forwarded-Proto      $forwarded_proto;
        proxy_set_header   X-Dockhand-Proxy-Token "";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
