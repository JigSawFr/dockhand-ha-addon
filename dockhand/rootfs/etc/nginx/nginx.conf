user root;
worker_processes 1;
# master_process off prevents worker forking, which avoids the initgroups(root,0)
# CAP_SETGID-blocked syscall in HA addon containers. Without this, nginx emits:
#   [emerg] initgroups(root, 0) failed (1: Operation not permitted)
# Without 'user root;', nginx defaults to nobody and tries to chown /tmp/nginx/*
# to uid 65534, which also fails. Both directives are required together.
master_process off;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    map_hash_bucket_size 256;

    # Only send Connection: upgrade when the client requests an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Loopback stays authorized for the native healthcheck. Every network client
    # must present the generated direct-proxy token.
    geo $direct_proxy_local {
        default   0;
        127.0.0.1 1;
        ::1       1;
    }

    # Preserve the outer reverse proxy's public origin when present, while
    # retaining sane values for optional direct host-port access.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    access_log /tmp/nginx/access.log;
    error_log  /tmp/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Keep temp files under /tmp to avoid restricted ownership changes.
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}