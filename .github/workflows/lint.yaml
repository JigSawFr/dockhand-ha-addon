name: Lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 0 * * *"

jobs:
  shellcheck:
    name: ShellCheck runtime scripts
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck sqlite3

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error \
            scripts/*.sh \
            dockhand/rootfs/etc/cont-init.d/*.sh \
            dockhand/rootfs/etc/services.d/*/run \
            dockhand/rootfs/etc/services.d/*/finish \
            dockhand/rootfs/usr/bin/dockhand-*

      - name: Run runtime script regression tests
        run: |
          scripts/test-backup-db.sh
          scripts/test-diagnostics-redaction.sh
          node scripts/test-ingress-shim.js
          scripts/release-dry-run.py --json

  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@a7c616ce81ccda50150bf1595786c71b1883fabb

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"
