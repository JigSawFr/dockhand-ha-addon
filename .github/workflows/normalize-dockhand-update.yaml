name: Normalize Dockhand update

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - dockhand/Dockerfile
      - scripts/release-plan.py
      - scripts/prepare-release-channel.py
      - .github/workflows/normalize-dockhand-update.yaml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: normalize-dockhand-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize Renovate Dockhand beta metadata
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'renovate[bot]' || startsWith(github.event.pull_request.head.ref, 'renovate/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize Dockhand beta release metadata
        id: normalize
        run: |
          set -euo pipefail
          current_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('dockhand/config.yaml').read_text()
          print(re.search(r'^version:\s+"([^"]+)"$', text, re.M).group(1))
          PY
          )
          dockhand_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('dockhand/Dockerfile').read_text()
          print(re.search(r'^FROM\s+fnsys/dockhand:v([^\s]+)\s+AS\s+dockhand$', text, re.M).group(1))
          PY
          )
          current_base=${current_version%%.*.*}
          current_base=$(python3 - "$current_version" <<'PY'
          import re, sys
          m = re.match(r'^(\d+\.\d+\.\d+)', sys.argv[1])
          print(m.group(1) if m else '')
          PY
          )

          if [[ "${current_version}" == *-beta.* && "${current_base}" == "${dockhand_version}" ]]; then
            echo "already_normalized=true" >> "$GITHUB_OUTPUT"
            echo "Dockhand PR already normalized for ${current_version}."
            exit 0
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          released_stable=$(git show origin/main:dockhand/config.yaml | python3 - <<'PY'
          import re
          import sys
          print(re.search(r'^version:\s+"([^"]+)"$', sys.stdin.read(), re.M).group(1))
          PY
          )

          python3 scripts/release-plan.py \
            --channel beta \
            --current-version "${current_version}" \
            --dockhand-version "${dockhand_version}" \
            --released-stable "${released_stable}" \
            --github-output "$GITHUB_OUTPUT"

          version=$(awk -F= '$1 == "version" { print $2 }' "$GITHUB_OUTPUT" | tail -1)
          python3 scripts/prepare-release-channel.py \
            --channel beta \
            --version "${version}" \
            --dockhand-version "${dockhand_version}" \
            --summary "Prepare beta validation for Dockhand upstream v${dockhand_version}."

          python3 scripts/check-version-sync.py --tag "v${version}"
          python3 scripts/check-public-privacy.py
          python3 scripts/check-addon-metadata.py
          scripts/release-dry-run.py --tag "v${version}" --json >/dev/null

      - name: Commit normalized metadata
        if: steps.normalize.outputs.already_normalized != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No normalization changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dockhand/config.yaml dockhand/Dockerfile dockhand/CHANGELOG.md README.md docs/channels.md repository.yaml
          git commit -m "chore(release): normalize Dockhand beta metadata"
          git push origin HEAD:"${HEAD_REF}"
