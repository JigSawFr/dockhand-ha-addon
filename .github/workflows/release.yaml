name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
      - "v*.*.*-beta.*"
      - "v*.*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.41.1 or 1.0.41.2-beta.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      image_tags: ${{ steps.validate.outputs.image_tags }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag, channel, config version, and changelog
        id: validate
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_VERSION="${DISPATCH_VERSION}"
            CHECK_TAG="v${TAG_VERSION}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            CHECK_TAG="${GITHUB_REF_NAME}"
          fi

          python3 scripts/check-version-sync.py --tag "${CHECK_TAG}"
          python3 scripts/check-public-privacy.py

          if [[ "${TAG_VERSION}" == *-beta.* ]]; then
            CHANNEL="beta"
            REQUIRED_BRANCH="dev"
            PRERELEASE="true"
            IMAGE_TAGS=$(printf 'ghcr.io/jigsawfr/dockhand-ha-addon:%s\nghcr.io/jigsawfr/dockhand-ha-addon:beta\n' "${TAG_VERSION}")
          else
            CHANNEL="stable"
            REQUIRED_BRANCH="main"
            PRERELEASE="false"
            IMAGE_TAGS=$(printf 'ghcr.io/jigsawfr/dockhand-ha-addon:%s\nghcr.io/jigsawfr/dockhand-ha-addon:latest\n' "${TAG_VERSION}")
          fi

          git fetch --no-tags origin "${REQUIRED_BRANCH}:refs/remotes/origin/${REQUIRED_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${REQUIRED_BRANCH}"; then
            echo "Release ${TAG_VERSION} must be published from ${REQUIRED_BRANCH}; ${GITHUB_SHA} is not contained in origin/${REQUIRED_BRANCH}."
            exit 1
          fi

          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          {
            echo "image_tags<<DOCKHAND_IMAGE_TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS}"
            echo "DOCKHAND_IMAGE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        id: notes
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          notes=$(awk -v ver="${VERSION}" '
            $0 ~ "^##[[:space:]]+" ver "$" { capture=1; next }
            capture && $0 ~ "^##[[:space:]]+" { exit }
            capture { print }
          ' dockhand/CHANGELOG.md)

          if [[ -z "${notes// /}" ]]; then
            echo "Could not extract release notes for ${VERSION} from dockhand/CHANGELOG.md"
            exit 1
          fi

          {
            echo "release_notes<<DOCKHAND_RELEASE_NOTES_EOF"
            echo "${notes}"
            echo "DOCKHAND_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ needs.validate.outputs.channel }} GHCR image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate GHCR PAT secret
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [[ -z "${GHCR_PAT}" ]]; then
            echo "GHCR_PAT secret is required to publish GHCR packages"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push multi-arch image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./dockhand
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.image_tags }}
          labels: |
            io.hass.type=app
            io.hass.name=Dockhand
            io.hass.description=Modern Docker management UI: a lightweight Portainer alternative.
            io.hass.url=https://github.com/JigSawFr/dockhand-ha-addon
            io.hass.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.source=https://github.com/JigSawFr/dockhand-ha-addon
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.ref.name=${{ needs.validate.outputs.channel }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.1

      - name: Sign published image tags
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE_TAGS: ${{ needs.validate.outputs.image_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${IMAGE_TAGS}"

  github-release:
    name: Create GitHub ${{ needs.validate.outputs.channel }} Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          body: ${{ needs.validate.outputs.release_notes }}
