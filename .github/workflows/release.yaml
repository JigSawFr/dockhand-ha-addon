name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.41.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Validate tag, config version, and changelog
        id: validate
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_VERSION="${DISPATCH_VERSION}"
            CHECK_TAG="v${TAG_VERSION}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            CHECK_TAG="${GITHUB_REF_NAME}"
          fi

          python3 scripts/check-version-sync.py --tag "${CHECK_TAG}"
          python3 scripts/check-public-privacy.py
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        id: notes
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          notes=$(awk -v ver="${VERSION}" '
            $0 ~ "^##[[:space:]]+" ver "$" { capture=1; next }
            capture && $0 ~ "^##[[:space:]]+" { exit }
            capture { print }
          ' dockhand/CHANGELOG.md)

          if [[ -z "${notes// /}" ]]; then
            echo "Could not extract release notes for ${VERSION} from dockhand/CHANGELOG.md"
            exit 1
          fi

          {
            echo "release_notes<<DOCKHAND_RELEASE_NOTES_EOF"
            echo "${notes}"
            echo "DOCKHAND_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish GHCR image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate GHCR PAT secret
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [[ -z "${GHCR_PAT}" ]]; then
            echo "GHCR_PAT secret is required to publish GHCR packages"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./dockhand
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jigsawfr/dockhand-ha-addon:${{ needs.validate.outputs.version }}
            ghcr.io/jigsawfr/dockhand-ha-addon:latest
          labels: |
            io.hass.type=app
            io.hass.name=Dockhand
            io.hass.description=Modern Docker management UI: a lightweight Portainer alternative.
            io.hass.url=https://github.com/JigSawFr/dockhand-ha-addon
            io.hass.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.source=https://github.com/JigSawFr/dockhand-ha-addon
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: v${{ needs.validate.outputs.version }}
          body: ${{ needs.validate.outputs.release_notes }}
