name: Version guard

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
      - "v*.*.*-beta.*"
      - "v*.*.*.*-beta.*"

permissions:
  contents: read

jobs:
  version-sync:
    name: Validate version sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate version metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 scripts/check-version-sync.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/check-version-sync.py
          fi

      - name: Validate add-on metadata
        run: python3 scripts/check-addon-metadata.py

  channel-sync:
    name: Validate beta is not behind stable
    if: github.base_ref == 'dev' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch stable channel
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate beta has absorbed stable
        run: python3 scripts/check-channel-sync.py
