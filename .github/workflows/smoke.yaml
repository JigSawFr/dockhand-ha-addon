name: Smoke test

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  smoke:
    name: Image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify ingress shim behavior
        run: node scripts/test-ingress-shim.js

      - name: Build amd64 image locally
        run: docker build -t dockhand-ha-addon:smoke ./dockhand

      - name: Inspect image metadata
        run: |
          docker image inspect dockhand-ha-addon:smoke \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -Fx 'https://github.com/JigSawFr/dockhand-ha-addon'
          docker image inspect dockhand-ha-addon:smoke \
            --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' \
            | grep -Fx 'Dockerhand by JigSawFr'

      - name: Verify packaged Dockhand app
        run: |
          docker run --rm --entrypoint /bin/bash dockhand-ha-addon:smoke -lc '
            set -euo pipefail
            test -f /app/server.js
            test -f /etc/services.d/dockhand/run
            test -f /etc/services.d/nginx/run
            test -f /etc/cont-init.d/01-protection-check.sh
            test -f /etc/cont-init.d/02-data-dir.sh
            test -f /etc/cont-init.d/03-backup-db.sh
            test -f /etc/nginx/conf.d/ingress.conf
            test -f /usr/bin/dockhand-healthcheck
            test -f /usr/bin/dockhand-diagnostics
            test -f /usr/bin/dockhand-support-bundle
            test -f /usr/share/dockhand-ha/ingress-shim.js
            mkdir -p \
              /tmp/nginx/client_temp \
              /tmp/nginx/proxy_temp \
              /tmp/nginx/fastcgi_temp \
              /tmp/nginx/uwsgi_temp \
              /tmp/nginx/scgi_temp
            node --version
            sqlite3 --version
            nginx -t
            grep -F "alias /usr/share/dockhand-ha/ingress-shim.js;" /etc/nginx/conf.d/ingress.conf
          '

      - name: Run real Home Assistant ingress E2E
        run: scripts/test-ingress-e2e.sh

      - name: Verify Home Assistant add-on metadata
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          cfg = pathlib.Path('dockhand/config.yaml').read_text()
          apparmor = pathlib.Path('dockhand/apparmor.txt').read_text()
          dockerfile = pathlib.Path('dockhand/Dockerfile').read_text()
          config_version = re.search(r'^version: "([^"]+)"$', cfg, re.M)
          dockhand_from = re.search(r'^FROM fnsys/dockhand:v([^\s]+) AS dockhand$', dockerfile, re.M)
          if not config_version or not dockhand_from:
              print('Could not parse add-on or Dockhand version')
              sys.exit(1)
          required = [
              'name: Dockhand',
              'slug: dockhand',
              'image: "ghcr.io/jigsawfr/dockhand-ha-addon"',
              'ingress: true',
              'ingress_stream: true',
              'docker_api: true',
              '3000/tcp: null',
              'ports_description:',
              'auto_backup_on_start: true',
              'backup_retention: 5',
              'backup_pre:',
              'backup_exclude:',
              'backups/*.sqlite',
          ]
          missing = [item for item in required if item not in cfg]
          if missing:
              print('Missing config entries:', missing)
              sys.exit(1)
          if 'HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3' not in dockerfile:
              print('Missing Docker HEALTHCHECK')
              sys.exit(1)
          if 'CMD /usr/bin/dockhand-healthcheck || exit 1' not in dockerfile:
              print('Docker HEALTHCHECK must call dockhand-healthcheck')
              sys.exit(1)
          required_apparmor = [
              'profile dockhand',
              'network inet stream,',
              'network unix stream,',
              '/var/run/docker.sock rw,',
              '/data/** rw,',
          ]
          missing_apparmor = [item for item in required_apparmor if item not in apparmor]
          if missing_apparmor:
              print('Missing AppArmor entries:', missing_apparmor)
              sys.exit(1)
          PY
