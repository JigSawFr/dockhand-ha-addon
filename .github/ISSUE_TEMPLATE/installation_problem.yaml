name: Installation problem
description: Get help with installing or starting the add-on
title: "[Install]: "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/installation.md` and `docs/troubleshooting.md` first.
  - type: dropdown
    id: protection-mode
    attributes:
      label: Protection Mode disabled?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.0.29"
  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: "amd64 or aarch64"
  - type: textarea
    id: problem
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Add-on logs
      description: Redact secrets and personal data before posting.
      render: text
