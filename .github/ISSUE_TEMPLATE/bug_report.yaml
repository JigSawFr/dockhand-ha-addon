name: Bug report
description: Report a reproducible add-on bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, tokens, raw backups, database dumps, or full unredacted diagnostics.
        If possible, attach the reviewed output of `dockhand-support-bundle`.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.0.41.2-beta.4"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options:
        - Stable
        - Beta / dev
        - Local development
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: "amd64 or aarch64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact clicks/actions needed to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or support bundle excerpt
      description: Redact secrets and personal data before posting.
      render: text
