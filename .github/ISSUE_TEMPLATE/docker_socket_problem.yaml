name: Docker socket / Protection Mode problem
description: Report Docker socket access or Protection Mode startup failures
title: "[Docker socket]: "
labels: [support, docker-socket]
body:
  - type: markdown
    attributes:
      value: |
        Dockhand requires Protection Mode disabled because it manages Docker through `/var/run/docker.sock`.
        Do not post private container names, registry credentials, or unredacted diagnostics.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.0.41.2-beta.4"
    validations:
      required: true
  - type: dropdown
    id: protection-mode
    attributes:
      label: Protection Mode disabled?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: socket
    attributes:
      label: Docker socket status from diagnostics
      options:
        - exists/readable/writable
        - exists but not readable or writable
        - missing
        - not checked
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Add-on logs or support bundle excerpt
      description: Redact secrets and personal data before posting.
      render: text
